# Application configuration for DTU Pay Facade Service

# Quarkus HTTP configuration
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# RabbitMQ configuration (uses environment variable RABBITMQ_HOST, defaults to localhost)
rabbitmq.host=${RABBITMQ_HOST:localhost}

# JSON-B configuration
quarkus.resteasy.json.pretty-print=true

# Logging configuration
quarkus.log.level=INFO
quarkus.log.category."dtu.pay.facade".level=DEBUG

# CORS configuration (for development)
quarkus.http.cors=true
quarkus.http.cors.origins=*

# OpenAPI / Swagger UI configuration
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.path=/swagger-ui
quarkus.swagger-ui.always-include=true